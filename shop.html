<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.title.shop">Shop — Akhmeteli Winery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="stylesheet" href="css/style.css?v=20260812" />
  <link rel="stylesheet" href="css/redesign.css?v=20260812" />
  <link rel="stylesheet" href="css/legal.css?v=20260812" />
  <link rel="stylesheet" href="css/shop2.css?v=20260812" />
  <!-- 18+ age gate (runs before paint to avoid a flash of content) -->
  <link rel="stylesheet" href="css/age-gate.css?v=20260812" />
  <script src="js/age-gate.js?v=20260812"></script>
</head>
<body class="shop2-page">

  <nav class="nav scrolled">
    <a href="index.html" class="nav-brand"><img src="img/logo-light.png" alt="Akhmeteli" class="brand-logo" /></a>
        <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav.home"></a></li>
      <li><a href="index.html#wines" data-i18n="nav.wines"></a></li>
      <li><a href="index.html#winery" data-i18n="nav.winery"></a></li>
      <li><a href="index.html#awards" data-i18n="nav.awards"></a></li>
      <li><a href="shop.html" data-i18n="nav.shop"></a></li>
      <li><a href="index.html#blog" data-i18n="nav.blog"></a></li>
      <li><a href="contact.html" data-i18n="nav.contact"></a></li>
    </ul>
    <div class="nav-tools">
      <div class="lang-switch">
        <button data-lang="ka">KA</button>
        <button data-lang="en">EN</button>
        <button data-lang="ru">RU</button>
      </div>
      <button class="cart-btn"><span data-i18n="nav.cart"></span><span class="cart-count"></span></button>
      <button class="menu-toggle" aria-label="Menu">☰</button>
    </div>
  </nav>

  <div class="vine-line" aria-hidden="true">
    <svg viewBox="0 0 60 800" preserveAspectRatio="none">
      <path class="vine-path" d="M30 0 C 10 80, 50 160, 30 240 C 10 320, 50 400, 30 480 C 10 560, 50 640, 30 720 L 30 800" />
    </svg>
  </div>

  <section class="shop2">
    <div class="shop2__wrap">
      <aside class="s2-aside" id="s2-aside">
        <button class="s2-aside__close" id="s2-aside-close" type="button" aria-label="Close filters">×</button>
        <ul class="s2-cat" id="s2-cat"></ul>

        <div class="s2-group s2-price-group open">
          <button class="s2-group__head" type="button" data-acc><span data-i18n="shop.filter.price">Price</span><i class="s2-chev"></i></button>
          <div class="s2-group__body">
            <div class="s2-price">
              <div class="s2-price__inputs">
                <span class="s2-price__field"><input type="number" id="s2-pmin"><i class="lari">₾</i></span>
                <span class="s2-price__sep">—</span>
                <span class="s2-price__field"><input type="number" id="s2-pmax"><i class="lari">₾</i></span>
              </div>
              <div class="s2-slider">
                <div class="s2-slider__track"><div class="s2-slider__fill" id="s2-fill"></div></div>
                <input type="range" id="s2-rmin">
                <input type="range" id="s2-rmax">
              </div>
              <div class="s2-slider__minmax"><span id="s2-lmin"></span><span id="s2-lmax"></span></div>
            </div>
          </div>
        </div>

        <div id="s2-groups"></div>

        <button class="s2-reset" id="s2-reset" data-i18n="shop.filter.reset">Reset filter</button>
      </aside>

      <div class="s2-main">
        <div class="s2-toolbar">
          <button class="s2-filter-toggle" id="s2-filter-toggle" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
            <span data-i18n="shop.filters">Filters</span>
          </button>
          <label for="s2-sort" data-i18n="shop.sort.label">Sort by:</label>
          <select class="s2-sort" id="s2-sort" aria-label="Sort">
            <option value="newest" data-i18n="shop.sort.newest">Newest</option>
            <option value="priceAsc" data-i18n="shop.sort.priceAsc">Price: Low to High</option>
            <option value="priceDesc" data-i18n="shop.sort.priceDesc">Price: High to Low</option>
            <option value="name" data-i18n="shop.sort.name">Name</option>
          </select>
        </div>
        <div class="s2-grid" id="s2-grid"></div>
      </div>
    </div>
  </section>

  <div class="s2-filter-backdrop" id="s2-filter-backdrop" aria-hidden="true"></div>

  <footer class="site-footer">
    <div class="container">
            <div class="footer-grid footer-grid--4">
        <div class="footer-brand">
          <span class="nav-brand"><img src="img/logo-light.png" alt="Akhmeteli" class="brand-logo" /></span>
          <p data-i18n="footer.tagline"></p>
        </div>
        <div class="footer-col">
          <h4 data-i18n="footer.main"></h4>
          <a href="index.html" data-i18n="nav.home"></a>
          <a href="index.html#wines" data-i18n="footer.wines"></a>
          <a href="index.html#chacha" data-i18n="footer.chacha"></a>
          <a href="index.html#winery" data-i18n="nav.winery"></a>
          <a href="shop.html" data-i18n="nav.shop"></a>
          <a href="index.html#blog" data-i18n="footer.blog"></a>
          <a href="contact.html" data-i18n="nav.contact"></a>
        </div>
        <div class="footer-col">
          <h4 data-i18n="footer.legal"></h4>
          <a href="terms.html" data-i18n="footer.terms"></a>
          <a href="privacy.html" data-i18n="footer.privacy"></a>
          <a href="delivery.html" data-i18n="footer.delivery"></a>
          <a href="refund.html" data-i18n="footer.return"></a>
          <a href="payment.html" data-i18n="footer.payment"></a>
        </div>
        <div class="footer-col">
          <h4 data-i18n="footer.social"></h4>
          <a href="#" target="_blank" rel="noopener">Facebook</a>
          <a href="#" target="_blank" rel="noopener">Instagram</a>
          <a href="#" target="_blank" rel="noopener">YouTube</a>
          <a href="#" target="_blank" rel="noopener">TikTok</a>
        </div>
      </div>
      <div class="company-block" data-company></div>
      <div class="footer-bottom">
        <span>&copy; <span id="year"></span> <span data-i18n="brand.producer"></span>. <span data-i18n="footer.rights"></span></span>
        <span data-i18n="foot.region">Akhmeta · Kakheti · Georgia</span>
      </div>
    </div>
  </footer>

  <div class="cart-overlay"></div>
  <aside class="cart-drawer">
    <div class="cart-head">
      <h3 data-i18n="cart.title"></h3>
      <button class="cart-close">×</button>
    </div>
    <div class="cart-body"></div>
    <div class="cart-foot"></div>
  </aside>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script src="js/i18n.js?v=20260812"></script>
  <script src="js/i18n-extra.js?v=20260812"></script>
  <script src="js/products.js"></script>
  <script src="js/company.js?v=20260812"></script>
  <script src="js/main.js?v=20260812"></script>
  <script src="js/cart.js?v=20260812"></script>
  <script src="js/shop2.js?v=20260812"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/animations.js?v=20260812"></script>
</body>
</html>
